[package]
name = "dspanel"
version = "1.1.1"
description = "DSPanel - Active Directory management tool"
authors = ["Rwx-G"]
license = "Apache-2.0"
edition = "2024"

[lib]
name = "dspanel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "process"] }
ldap3 = { version = "0.12", default-features = false, features = ["sync", "tls-rustls-ring"] }
rustls = "0.23"
rustls-pemfile = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.10"
sha1 = "0.11"
sha2 = "0.11"
reqwest = { version = "0.13", features = ["rustls", "json", "form"], default-features = false }
hickory-resolver = "0.26"
hmac = "0.13"
data-encoding = "2"
qrcode = "0.14"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
rfd = "0.17"
quick-xml = "0.39"
csv = "1"
printpdf = { version = "0.9", default-features = false }
rust_xlsxwriter = "0.94"
rusqlite = { version = "0.40", features = ["bundled"] }
zeroize = "1"
notify = { version = "8", features = ["macos_fsevent"] }
notify-debouncer-mini = "0.7"
keyring = { version = "3", features = ["sync-secret-service"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Security_Cryptography",
    "Win32_Security_Authorization",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-window-state = "2.4.1"

[features]
default = ["gssapi"]
gssapi = ["ldap3/gssapi"]
demo = []

[dev-dependencies]
tempfile = "3"
mockito = "1"
serial_test = "3"
